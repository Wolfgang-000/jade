<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>御翠珠宝 - 翡翠珠宝商城</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="app">
        <header class="header">
            <div class="header-top">
                <div class="container">
                    <div class="header-info">
                        <span><i class="fas fa-phone"></i> 全国服务热线：400-888-8888</span>
                    </div>
                    <div class="header-links">
                        <a href="#" onclick="navigateTo('home')">首页</a>
                        <a href="#" id="userLink" onclick="navigateTo('login')">登录</a>
                        <a href="#" onclick="navigateTo('cart')">
                            <i class="fas fa-shopping-cart"></i> 购物车
                            <span id="cartBadge" class="cart-badge">0</span>
                        </a>
                        <a href="#" onclick="navigateTo('favorites')">
                            <i class="fas fa-heart"></i> 收藏
                        </a>
                    </div>
                </div>
            </div>
            <div class="header-main">
                <div class="container">
                    <div class="logo" onclick="navigateTo('home')">
                        <h1>御翠珠宝</h1>
                        <p>The Trone</p>
                    </div>
                    <nav class="nav">
                        <a href="#" onclick="navigateTo('home')" class="nav-item" data-page="home">首页</a>
                        <a href="#" onclick="navigateTo('products')" class="nav-item" data-page="products">翡翠饰品</a>
                        <a href="#" onclick="navigateTo('orders')" class="nav-item" data-page="orders">我的订单</a>
                        <a href="#" onclick="navigateTo('profile')" class="nav-item" data-page="profile">个人中心</a>
                    </nav>
                    <div class="search-box">
                        <input type="text" id="searchInput" placeholder="搜索珠宝饰品..." onkeyup="handleSearch(event)">
                        <button onclick="performSearch()"><i class="fas fa-search"></i></button>
                    </div>
                </div>
            </div>
        </header>

        <main id="mainContent">
        </main>

        <footer class="footer">
            <div class="container">
                <div class="footer-content">
                    <div class="footer-section">
                        <h3>御翠珠宝</h3>
                        <p>The Trone</p>
                        <p class="footer-slogan">翠韵天成 · 玉润人生</p>
                    </div>
                    <div class="footer-section">
                        <h4>快速链接</h4>
                        <a href="#" onclick="navigateTo('home')">首页</a>
                        <a href="#" onclick="navigateTo('products')">产品</a>
                        <a href="#" onclick="navigateTo('orders')">订单</a>
                        <a href="#" onclick="navigateTo('profile')">个人中心</a>
                    </div>
                    <div class="footer-section">
                        <h4>客户服务</h4>
                        <a href="#">购物指南</a>
                        <a href="#">售后服务</a>
                        <a href="#">保养知识</a>
                        <a href="#">常见问题</a>
                    </div>
                    <div class="footer-section">
                        <h4>联系我们</h4>
                        <p><i class="fas fa-phone"></i> 400-888-8888</p>
                        <p><i class="fas fa-envelope"></i> service@yucui.com</p>
                        <p><i class="fas fa-map-marker-alt"></i> 北京市朝阳区珠宝大道100号</p>
                    </div>
                </div>
                <div class="footer-bottom">
                    <p>&copy; 2026 御翠珠宝 版权所有</p>
                </div>
            </div>
        </footer>
    </div>

    <div id="toast" class="toast"></div>
    <div id="modal" class="modal"></div>

    <script src="script.js"></script>
</body>
</html>
